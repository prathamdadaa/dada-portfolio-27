<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pratham Dada — Developer Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #000;
      color: #fff;
      overflow-x: hidden;
    }

    /* HERO CONTAINER */
    .hero-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* 1. BACKGROUND VIDEO */
    .bg-video {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      z-index: 1;
      transform: translate(-50%, -50%);
      object-fit: cover;
      filter: opacity(0.65) contrast(1.2);
    }

    /* 2. NOISE & TEXTURE OVERLAY */
    .texture-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      /* SVG Noise Overlay */
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
      background-repeat: repeat;
      pointer-events: none;
    }

    /* Dark Vignette / Gradient Overlay for readability */
    .gradient-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      background: radial-gradient(circle at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.85) 100%),
                  linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 40%, rgba(0,0,0,0.9) 100%);
      pointer-events: none;
    }

    /* 3. CONTENT & NAVBAR */
    .content-wrapper {
      position: relative;
      z-index: 4;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2rem 4rem;
    }

    /* NAVBAR */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      color: #a1a1aa;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #fff;
    }

    .nav-buttons {
      display: flex;
      gap: 1rem;
    }

    /* BUTTONS */
    .btn {
      padding: 0.6rem 1.2rem;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn-secondary {
      background: transparent;
      color: #fff;
      border: 1px solid #27272a;
    }

    .btn-secondary:hover {
      background: #18181b;
    }

    .btn-primary {
      background: #fff;
      color: #000;
      border: 1px solid #fff;
    }

    .btn-primary:hover {
      background: #e4e4e7;
    }

    /* HERO MAIN TEXT */
    .hero-body {
      max-width: 800px;
      margin-bottom: 4rem;
    }

    .hero-title {
      font-size: clamp(2.5rem, 5vw, 4.5rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -2px;
      margin-bottom: 1.5rem;
    }

    .hero-subtitle {
      font-size: 1.15rem;
      color: #a1a1aa;
      max-width: 600px;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .cta-group {
      display: flex;
      gap: 1rem;
    }
  </style>
</head>
<body>

  <div class="hero-container">
    <!-- 1. Video Tag (Loop, Autoplay, Muted required for auto-play) -->
    <video class="bg-video" autoplay loop muted playsinline>
      <source src="https://assets.mixkit.co/videos/preview/mixkit-abstract-fast-line-lights-31835-large.mp4" type="video/mp4">
    </video>

    <!-- 2. Texture & Dark Overlay -->
    <div class="texture-overlay"></div>
    <div class="gradient-overlay"></div>

    <!-- 3. Foreground Content -->
    <div class="content-wrapper">
      <nav>
        <div class="logo">Pratham Dada</div>
        <ul class="nav-links">
          <li><a href="#">Resources</a></li>
          <li><a href="#">Pricing</a></li>
          <li><a href="#">Docs</a></li>
          <li><a href="#">Discord</a></li>
        </ul>
        <div class="nav-buttons">
          <a href="#" class="btn btn-secondary">Login</a>
          <a href="#" class="btn btn-primary">Sign Up</a>
        </div>
      </nav>

      <div class="hero-body">
        <h1 class="hero-title">The Developer Platform<br>for Modern APIs</h1>
        <p class="hero-subtitle">
          Unifies your infrastructure. Deploy APIs instantly, protect them with keys and rate limits, and understand usage in one place.
        </p>
        <div class="cta-group">
          <a href="#" class="btn btn-primary">Start for free</a>
          <a href="#" class="btn btn-secondary">Get a demo</a>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
